    const map = L.map("map", { preferCanvas: true, zoomControl: false });
    L.control.zoom({ position: "topright" }).addTo(map);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 22,
      attribution: "&copy; OpenStreetMap contributors"
    }).addTo(map);

    // Hiển thị số lượng sequence + ID nếu chỉ có 1 sequence
    const sequenceIds = DATA.sequence_ids || [];
    const seqCount = DATA.stats?.sequences || sequenceIds.length;

    let text = `Sequence${seqCount > 1 ? 's' : ''}: ${seqCount}`;
    if (seqCount === 1 && sequenceIds.length > 0) {
      text += ` (${sequenceIds[0]})`;
    }

    document.getElementById("sequence").textContent = text;
    document.getElementById("totalDetections").textContent =
      (DATA.stats.total_records || DATA.detections.length).toLocaleString();
    document.getElementById("routeImages").textContent =
      (DATA.stats.route_images || DATA.route.length).toLocaleString();
    document.getElementById("exactPoints").textContent =
      (DATA.stats.map_feature_objects || 0).toLocaleString();
    document.getElementById("cameraPoints").textContent =
      (DATA.stats.camera_points || 0).toLocaleString();

    const exactLayer = L.layerGroup().addTo(map);
    const cameraLayer = L.layerGroup();
    const routeLayer = L.layerGroup().addTo(map);
    const imageLayer = L.layerGroup().addTo(map);
    const bounds = L.latLngBounds();

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function popupHtml(item) {
      const bbox = item.bbox;
      const bboxHtml = bbox
        ? `<div class="bbox" style="left:${bbox.x * 100}%;top:${bbox.y * 100}%;width:${bbox.w * 100}%;height:${bbox.h * 100}%;"></div>`
        : "";
      const polygonHtml = segmentationSvg([item]);
      const thumb = item.thumb_url
        ? `<div class="thumb-wrap"><img src="${escapeHtml(item.thumb_url)}" loading="lazy">${polygonHtml}${bboxHtml}</div>`
        : "";
      const mapillary = item.mapillary_image_url
        ? `<a href="${escapeHtml(item.mapillary_image_url)}" target="_blank" rel="noreferrer">Open Mapillary image</a>`
        : "";
      const sourceLabel = item.point_source === "map_feature"
        ? "map feature"
        : "camera fallback";
      return `
        <div class="popup">
          <div class="popup-title">${escapeHtml(item.object_label)}</div>
          <div class="popup-meta">
            detection: ${escapeHtml(item.detection_id)}<br>
            image: ${escapeHtml(item.image_id)}<br>
            point: ${sourceLabel}<br>
            captured: ${escapeHtml(item.captured_at || "")}
          </div>
          ${thumb}
          ${mapillary}
        </div>
      `;
    }

    function segmentationSvg(items) {
      const polygons = [];
      for (const item of items || []) {
        const cls = item.point_source === "map_feature"
          ? "seg-poly exact-poly"
          : "seg-poly";
        for (const polygon of item.polygons || []) {
          const points = polygon
            .map(point => `${point[0]},${point[1]}`)
            .join(" ");
          if (points) {
            polygons.push(`<polygon class="${cls}" points="${points}"></polygon>`);
          }
        }
      }
      if (!polygons.length) {
        return "";
      }
      return `<svg class="seg-overlay" viewBox="0 0 1 1" preserveAspectRatio="none">${polygons.join("")}</svg>`;
    }

    function imagePopupHtml(image) {
      const boxes = (image.detections || [])
        .filter(item => item.bbox)
        .map((item, index) => {
          const bbox = item.bbox;
          const cls = item.point_source === "map_feature" ? "bbox exact-box" : "bbox";
          return `<div class="${cls}" style="left:${bbox.x * 100}%;top:${bbox.y * 100}%;width:${bbox.w * 100}%;height:${bbox.h * 100}%;"><span>${index + 1}</span></div>`;
        })
        .join("");
      const polygonHtml = segmentationSvg(image.detections || []);
      const thumb = image.thumb_url
        ? `<div class="thumb-wrap"><img src="${escapeHtml(image.thumb_url)}" loading="lazy">${polygonHtml}${boxes}</div>`
        : "";
      const detections = (image.detections || []).map((item, index) => {
        const source = item.point_source === "map_feature" ? "map feature" : "camera";
        return `${index + 1}. ${escapeHtml(item.detection_id)} · ${source}`;
      }).join("<br>");
      const mapillary = image.mapillary_image_url
        ? `<a href="${escapeHtml(image.mapillary_image_url)}" target="_blank" rel="noreferrer">Open Mapillary image</a>`
        : "";
      return `
        <div class="popup">
          <div class="popup-title">Image ${escapeHtml(image.image_id)} · ${image.detection_count} detections</div>
          <div class="popup-meta">
            captured: ${escapeHtml(image.captured_at || "")}<br>
            compass: ${escapeHtml(image.compass_angle || "")}
          </div>
          ${thumb}
          <div class="popup-meta" style="margin-top:8px">${detections}</div>
          ${mapillary}
        </div>
      `;
    }

    function mapFeaturePopupHtml(feature) {
      const items = (feature.detections || []).map((item, index) => {
        const polygonHtml = segmentationSvg([item]);
        const bbox = item.bbox;
        const bboxHtml = bbox
          ? `<div class="bbox exact-box" style="left:${bbox.x * 100}%;top:${bbox.y * 100}%;width:${bbox.w * 100}%;height:${bbox.h * 100}%;"><span>${index + 1}</span></div>`
          : "";
        const thumb = item.thumb_url
          ? `<div class="thumb-wrap"><img src="${escapeHtml(item.thumb_url)}" loading="lazy">${polygonHtml}${bboxHtml}</div>`
          : "";
        const mapillary = item.mapillary_image_url
          ? `<a href="${escapeHtml(item.mapillary_image_url)}" target="_blank" rel="noreferrer">Open image</a>`
          : "";
        return `
          <div class="feature-item">
            <div class="popup-meta">
              ${index + 1}. image: ${escapeHtml(item.image_id)}<br>
              detection: ${escapeHtml(item.detection_id)}<br>
              captured: ${escapeHtml(item.captured_at || "")}
            </div>
            ${thumb}
            ${mapillary}
          </div>
        `;
      }).join("");
      return `
        <div class="feature-popup">
          <div class="popup-title">Map feature ${escapeHtml(feature.map_feature_id)}</div>
          <div class="popup-meta">
            object position: ${feature.lat.toFixed(7)}, ${feature.lon.toFixed(7)}<br>
            images tracking this object: ${feature.image_count} · detections: ${feature.detection_count}
          </div>
          <div class="feature-list">${items}</div>
        </div>
      `;
    }

    function markerStyle(source) {
      const exact = source === "map_feature";
      return {
        radius: exact ? 6 : 4,
        color: exact ? "#066e4f" : "#a45508",
        weight: 1,
        fillColor: exact ? "#0f9f6e" : "#e28616",
        fillOpacity: exact ? 0.88 : 0.62
      };
    }

    for (const item of DATA.detections) {
      if (item.point_source === "map_feature") {
        continue;
      }
      const marker = L.circleMarker([item.lat, item.lon], markerStyle(item.point_source))
        .bindPopup(() => popupHtml(item), { maxWidth: 340 });
      marker.addTo(cameraLayer);
      bounds.extend([item.lat, item.lon]);
    }

    for (const feature of DATA.map_features || []) {
      L.circleMarker([feature.lat, feature.lon], {
        radius: 8,
        color: "#066e4f",
        weight: 2,
        fillColor: "#0f9f6e",
        fillOpacity: 0.9
      })
        .bindPopup(() => mapFeaturePopupHtml(feature), { maxWidth: 560 })
        .bindTooltip(`map feature · ${feature.image_count} images`)
        .addTo(exactLayer);
      bounds.extend([feature.lat, feature.lon]);
    }

    if (DATA.route.length) {
      const routeBySequence = new Map();
      DATA.route.forEach((point, index) => {
        const key = point.sequence_id || "unknown";
        if (!routeBySequence.has(key)) {
          routeBySequence.set(key, []);
        }
        routeBySequence.get(key).push({ ...point, _route_index: index });
      });
      for (const points of routeBySequence.values()) {
        points.sort((a, b) => {
          const aKey = a.captured_at || "";
          const bKey = b.captured_at || "";
          if (aKey === bKey) {
            return (a.image_id || "").localeCompare(b.image_id || "") || (a._route_index - b._route_index);
          }
          return aKey.localeCompare(bKey);
        });
        const routePoints = points.map(p => [p.lat, p.lon]);
        L.polyline(routePoints, {
          color: "#2563eb",
          weight: 3,
          opacity: 0.7
        }).addTo(routeLayer);
      }
      for (const p of DATA.route) {
        const count = p.detection_count || 0;
        const icon = L.divIcon({
          className: "",
          html: `<div class="image-dot ${count ? "" : "empty"}">${count}</div>`,
          iconSize: [28, 28],
          iconAnchor: [14, 14],
          popupAnchor: [0, -14]

    <script>
        const stableFrame = document.getElementById("pane-stable");
        const heatFrame = document.getElementById("pane-heatmap");
        const stableTemplate = document.getElementById("stable-html");
        const heatTemplate = document.getElementById("heatmap-html");

        function setFrameContent(frame, template) {
            const blob = new Blob([template.innerHTML], { type: "text/html" });
            frame.src = URL.createObjectURL(blob);
        }

        setFrameContent(stableFrame, stableTemplate);
        let heatmapLoaded = false;
        function activateTab(tabId) {
            const tabs = document.querySelectorAll(".tab");
            const panes = document.querySelectorAll(".pane");
            tabs.forEach((tab) => tab.classList.toggle("active", tab.dataset.tab === tabId));
            panes.forEach((pane) => pane.classList.toggle("active", pane.id === `pane-${tabId}`));
            if (tabId === "heatmap" && !heatmapLoaded) {
                    setFrameContent(heatFrame, heatTemplate);
                heatmapLoaded = true;
            }
        }

        document.querySelectorAll(".tab").forEach((tab) => {
            tab.addEventListener("click", () => activateTab(tab.dataset.tab));
        });
    </script>
